<p class="eyebrow">Staff workspace</p><h1>Audit trail</h1>
<p class="intro">The latest 100 recorded events. This view is read-only.</p>
<div class="card table"><table>
    <thead><tr><th>Time (UTC)</th><th>Actor</th><th>Event</th><th>Order</th><th>Details</th></tr></thead>
    <tbody>
        <% for (const row of rows) { %>
            <tr><td><%= stamp(row.created) %></td><td><%= row.name %></td><td><%= row.event %></td>
                <td><%= row.order_id ?? '—' %></td><td><%= row.detail %></td></tr>
        <% } %>
    </tbody>
</table></div>
