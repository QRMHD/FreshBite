<section class="card narrow">
    <p class="eyebrow">Staff workspace</p><h1><%= title %></h1>
    <form method="post">
        <input type="hidden" name="csrf" value="<%= csrf %>">
        <label>Item name<input name="name" maxlength="80" required value="<%= values.name ?? '' %>"></label>
        <label>Restaurant<input name="restaurant" maxlength="80" required value="<%= values.restaurant ?? '' %>"></label>
        <label>Category<input name="category" maxlength="40" required value="<%= values.category ?? '' %>"></label>
        <label>Description<textarea name="description" maxlength="240" required><%= values.description ?? '' %></textarea></label>
        <label>Price (RM)<input name="price" type="number" min="0.01" max="9999.99" step="0.01" required value="<%= values.price ?? '' %>"></label>
        <button type="submit">Save item</button>
    </form>
    <p><a href="/admin/menu">Back to menu management</a></p>
</section>
